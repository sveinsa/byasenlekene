<meta name="mobile-web-app-capable" content="yes">

<style>
html,body{margin:0;height:100%;background:#0b0f1a;overflow:hidden;overscroll-behavior:none;touch-action:none;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:'Barlow Condensed','Roboto Condensed','sans-serif-condensed','Arial Narrow',system-ui,sans-serif;font-style:italic;font-weight:800}
#wrap{position:fixed;left:0;top:0;width:100%;height:100%}
canvas{position:absolute;display:block;image-rendering:auto;background:#05081a;touch-action:none}
#hint{display:none;position:fixed;color:#7d8aa8;font-size:12px;padding:0 10px;box-sizing:border-box;line-height:1.3}
.mini{position:fixed;width:34px;height:34px;border-radius:10px;border:1.5px solid rgba(160,190,255,.45);box-sizing:border-box;
  background:linear-gradient(180deg,rgba(30,46,104,.8),rgba(8,13,38,.85));backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);box-shadow:0 2px 8px rgba(0,0,0,.4);color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;z-index:6;cursor:pointer;left:0;top:0}
#touch{position:fixed;left:0;top:0;right:0;bottom:0;z-index:4;display:none;pointer-events:none;--s:90px;--pw:110px;--cw:110px;--ph:260px}
body.touch #touch{display:block}
.zone{position:absolute;display:flex;align-items:center;justify-content:center;pointer-events:none;box-sizing:border-box}
body.land #zR{flex-direction:column;justify-content:flex-end;gap:calc(var(--s)*.22);padding-bottom:calc(var(--s)*.35)}
body.land #zL{align-items:flex-end;padding-bottom:calc(var(--s)*.3)}
body.port #zR{flex-direction:row;align-items:flex-end;justify-content:center;gap:calc(var(--s)*.18);padding-bottom:calc(var(--s)*.25)}
body.port #zL{align-items:flex-end;padding-bottom:calc(var(--s)*.25)}
.btn{pointer-events:auto;touch-action:none;box-sizing:border-box;border-radius:24%;
  background:linear-gradient(180deg,rgba(60,84,170,.62),rgba(12,20,56,.78));border:2px solid rgba(170,196,255,.55);
  box-shadow:0 3px 12px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.35);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
  color:rgba(255,255,255,.95);font:italic 800 calc(var(--s)*.36) 'Barlow Condensed','Roboto Condensed','sans-serif-condensed','Arial Narrow',system-ui,sans-serif;
  text-shadow:0 1px 3px rgba(0,0,0,.6);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;cursor:pointer;transition:transform .05s}
.btn small{font:italic 800 calc(var(--s)*.15) 'Barlow Condensed','Roboto Condensed','sans-serif-condensed','Arial Narrow',system-ui,sans-serif;opacity:.95;margin-top:calc(var(--s)*.05);letter-spacing:1px;text-align:center}
.btn.on{background:linear-gradient(180deg,rgba(150,176,255,.75),rgba(60,84,170,.8));transform:scale(.95);box-shadow:0 1px 5px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.5)}
.round{border-radius:50%}
#kA{width:var(--s);height:var(--s);background:linear-gradient(180deg,rgba(240,70,76,.78),rgba(130,16,26,.88));border-color:rgba(255,160,160,.9)}
#kA.on{background:linear-gradient(180deg,rgba(255,130,134,.9),rgba(190,30,40,.92))}
#kB small{font-size:calc(var(--s)*.12);letter-spacing:.3px}
#kB{display:none;width:calc(var(--s)*.76);height:calc(var(--s)*.76);background:linear-gradient(180deg,rgba(70,130,255,.75),rgba(16,40,130,.88));border-color:rgba(160,195,255,.95);font-size:calc(var(--s)*.3)}
body[data-b="1"] #kB{display:flex}
#dpad{display:none;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:3px;width:var(--cw);height:var(--cw)}
#dpad .btn{width:auto;height:auto;border-radius:20%;font-size:calc(var(--cw)*.14)}
#dpad .hub{grid-area:2/2;pointer-events:none;border-radius:50%;margin:16%;background:radial-gradient(circle at 40% 35%,rgba(120,146,230,.45),rgba(8,13,38,.7));border:1.5px solid rgba(170,196,255,.3)}
#dpad [data-k=u]{grid-area:1/2}#dpad [data-k=l]{grid-area:2/1}#dpad [data-k=r]{grid-area:2/3}#dpad [data-k=d]{grid-area:3/2}
#runpad{display:none;width:var(--pw);height:var(--ph);border-radius:calc(var(--s)*.3);background:linear-gradient(180deg,rgba(255,214,70,.3),rgba(120,84,0,.5));border-color:rgba(255,214,90,.9);color:#ffe27a;font-size:calc(var(--s)*.34)}
#runpad small{font-size:calc(var(--s)*.16)}
#runpad.on{background:linear-gradient(180deg,rgba(255,226,120,.6),rgba(180,130,10,.7))}
body[data-pad="nav"] #dpad{display:grid}
body[data-pad="run"] #runpad,body[data-pad="a"] #runpad{display:flex}
body[data-pad="none"] #zL{visibility:hidden}
</style>

<body class="land">
<div id="wrap"><canvas id="c" width="400" height="225"></canvas></div>
<div id="hint">Snu telefonen til liggende for best opplevelse</div>
<div class="mini" id="bMute" title="Lyd">&#128266;</div>

      <div class="btn" data-k="d">&#9660;</div>
    </div>
    <div class="btn" id="runpad"><span id="runLab">LØP</span><small id="runSub">TRYKK RASKT</small></div>
  </div>
  <div class="zone" id="zR">
    <div class="btn round" id="kB" data-k="b">B<small id="bLab"></small></div>
    <div class="btn round" id="kA" data-k="a">A<small id="aLab"></small></div>
  </div>
</div>
<script>
'use strict';
/* =====================================================================
   BYÅSENLEKENE MANGEKAMP  –  retro arkade-friidrett (Canvas, null avhengigheter)
   Deler: 1 Kjerne  2 Data/sprites/bakgrunn  3 Scener  4 Øvelser  5 Oppstart
   ===================================================================== */
const W = 400, H = 225;              /* logiske koordinater (spillogikken) */
const S = 3;                         /* tegneoppløsning: 3 x logisk = 1200 x 675 piksler */
const cv = document.getElementById('c');
cv.width = W * S; cv.height = H * S;
const g = cv.getContext('2d');
g.setTransform(S, 0, 0, S, 0, 0); g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';

/* ---------- små hjelpere ---------- */
/* hjelpemodus (lett): mer tilgivende timing og automatisk fart. Standard PÅ. */
const Assist = { on: true };
const EZ = () => Assist.on;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const gauss = () => { let u = 0; for (let i = 0; i < 6; i++) u += Math.random(); return (u - 3) / 0.7071; };
const D2R = Math.PI / 180;
const mkCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
/* høyoppløselig lerret i logiske enheter (w x h), tegnes med x.scale(S) allerede satt */
function mkHi(w, h) { const c = mkCanvas(Math.ceil(w * S), Math.ceil(h * S)); const x = c.getContext('2d'); x.scale(S, S); x.imageSmoothingEnabled = true; return c; }
const blit = (img, x, y, w, h) => g.drawImage(img, x, y, w != null ? w : img.width / S, h != null ? h : img.height / S);
const fmt2 = v => (Math.round(v * 100) / 100).toFixed(2);
const fmtTime = s => s >= 60 ? Math.floor(s / 60) + ':' + (s % 60 < 9.995 ? '0' : '') + (s % 60).toFixed(2) : s.toFixed(2);
const fmtTime1 = s => s >= 60 ? Math.floor(s / 60) + ':' + (s % 60 < 9.95 ? '0' : '') + (s % 60).toFixed(1) : s.toFixed(1);
const store = {
  get(k, d) { try { const v = localStorage.getItem('byasen.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('byasen.' + k, JSON.stringify(v)); } catch (e) { } }
};

/* ---------- farger (NES-aktig palett) ---------- */
const C = {
  black: '#0b0f1a', white: '#ffffff', ink: '#1a1c2c', grey: '#8b93a7', dgrey: '#4a5068',
  red: '#d8232a', dred: '#8e1620', track: '#c8553d', track2: '#b94a35', trackLine: '#f4e9dc',
  grass: '#3f9b4b', grass2: '#368a42', sand: '#e8cf8a', sand2: '#d4b86e',
  yellow: '#ffd23f', orange: '#f39c34', blue: '#2f6fdb', dblue: '#1c3f95', green: '#2ea558', pink: '#ff7aa8',
  sky1: '#4aa3e8', sky2: '#8fd0f5', sky3: '#c9ecfb', skin1: '#f1b78f', skin2: '#c98a5c', skin3: '#8d5a3a', skin4: '#e8a077'
};

/* ---------- tekst: moderne sportssendings-font (smal, kursiv, fet) ---------- */
const FONT_STACK = '"Barlow Condensed","Roboto Condensed","sans-serif-condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif';
const fontFor = sc => 'italic 800 ' + (9.4 * sc).toFixed(1) + 'px ' + FONT_STACK;
let _mctx = null; const _twc = new Map();
const tw = (s, sc = 1) => {
  s = String(s).toUpperCase(); const k = sc + '|' + s; let v = _twc.get(k);
  if (v === undefined) {
    if (!_mctx) _mctx = document.createElement('canvas').getContext('2d');
    _mctx.font = fontFor(sc); try { _mctx.letterSpacing = (.35 * sc) + 'px'; } catch (e) { }
    v = _mctx.measureText(s).width; if (_twc.size > 800) _twc.clear(); _twc.set(k, v);
  }
  return v;
};
/* tegn tekst i valgfri kontekst. y = toppen av tekstlinjen, x etter justering l/c/r */
function T(ctx, s, x, y, col = C.white, sc = 1, al = 'l', sh = C.black) {
  s = String(s).toUpperCase();
  ctx.save();
  ctx.font = fontFor(sc); try { ctx.letterSpacing = (.35 * sc) + 'px'; } catch (e) { }
  ctx.textBaseline = 'alphabetic'; ctx.textAlign = al === 'c' ? 'center' : al === 'r' ? 'right' : 'left';
  const by = y + 7.9 * sc, ox = al === 'c' ? .17 * sc : 0;
  if (sh) { ctx.fillStyle = sh === C.black ? 'rgba(0,0,0,.6)' : sh; ctx.fillText(s, x + ox + .45 * sc, by + .55 * sc); }
  ctx.fillStyle = col; ctx.fillText(s, x + ox, by);
  ctx.restore();
}
const txt = (s, x, y, col, sc, al, sh) => T(g, s, x, y, col, sc, al, sh);
function box(ctx, x, y, w, h, fill, border) {
  if (border) { ctx.fillStyle = border; ctx.fillRect(x - 1, y - 1, w + 2, h + 2); }
  ctx.fillStyle = fill; ctx.fillRect(x, y, w, h);
}
function disc(ctx, cx, cy, r, col) {
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(cx, cy, Math.max(.5, r), 0, 6.2832); ctx.fill();
}
/* kapsel-linje med runde ender */
function pline(ctx, x0, y0, x1, y1, th, col) {
  ctx.strokeStyle = col; ctx.lineWidth = th; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
}
/* skrå «sendingsbånd»: parallellogram med skråkant sk til høyre */
function slant(ctx, x, y, w, h, sk, fill) {
  ctx.fillStyle = fill; ctx.beginPath(); ctx.moveTo(x + sk, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w - sk, y + h); ctx.lineTo(x, y + h); ctx.closePath(); ctx.fill();
}
function rrect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

/* ---------- input: tastatur + touch ---------- */
const Clk = { now: () => performance.now() };
const Input = {
  down: {}, hit: {}, rel: {},
  ts: 0, tap: null,
  press(k) { if (!this.down[k]) { this.down[k] = 1; this.hit[k] = 1; this.ts = Clk.now(); } },
  release(k) { if (this.down[k]) { this.down[k] = 0; this.rel[k] = 1; } },
  end() { this.hit = {}; this.rel = {}; this.tap = null; },
  clear() { this.hit = {}; this.rel = {}; this.tap = null; },
  releaseAll() { for (const k in this.down) if (this.down[k]) this.release(k); }
};
const KEYMAP = {
  ArrowLeft: 'l', KeyA: 'l', ArrowRight: 'r', KeyD: 'r',
  KeyZ: 'a', Space: 'a', Enter: 'a', KeyJ: 'a', KeyX: 'b', KeyK: 'b', Backspace: 'b', ShiftLeft: 'b', ShiftRight: 'b',
  ArrowUp: 'u', KeyW: 'u', ArrowDown: 'd', KeyS: 'd', Escape: 'p', KeyP: 'p', KeyM: 'm'
};
addEventListener('keydown', e => {
  const k = KEYMAP[e.code];
  if (!k) return;
  e.preventDefault();
  Snd.init();
  if (!e.repeat) Input.press(k);
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) { e.preventDefault(); Input.release(k); } });
addEventListener('blur', () => { Input.releaseAll(); if (typeof Game !== 'undefined' && Game.pause) Game.pause(true); });
/* ---- touch: knapper (A/B/piler) + stort LØP-felt som veksler automatisk mellom venstre/høyre ---- */
const $ = id => document.getElementById(id);
document.querySelectorAll('[data-k]').forEach(el => {
  const k = el.dataset.k;
  const dn = e => { e.preventDefault(); try { el.setPointerCapture(e.pointerId); } catch (_) { } el.classList.add('on'); Snd.init(); Input.press(k); };
  const up = e => { e.preventDefault(); el.classList.remove('on'); Input.release(k); };
  el.addEventListener('pointerdown', dn);
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(n => el.addEventListener(n, up));
  el.addEventListener('contextmenu', e => e.preventDefault());
});
const TUI = {
  last: '', tog: 0,
  /* hver scene kan ha ctl = { pad: 'nav'|'run'|'a'|'none', a: 'tekst', b: 'tekst', pl: 'tekst på feltet' } */
  sync(sc) {
    const def = { pad: 'nav', a: 'OK', b: 'TILBAKE' };
    const c = (typeof Game !== 'undefined' && Game.paused) ? { pad: 'none', a: 'FORTSETT', b: 'AVSLUTT' } : ((sc && (typeof sc.ctl === 'function' ? sc.ctl() : sc.ctl)) || def);
    const key = c.pad + '|' + (c.a || '') + '|' + (c.b || '') + '|' + (c.pl || '');
    if (key === this.last) return;
    this.last = key;
    const b = document.body;
    b.dataset.pad = c.pad; b.dataset.b = c.b ? '1' : '0';
    $('aLab').textContent = c.a || ''; $('bLab').textContent = c.b || '';
    $('runLab').textContent = c.pl || (c.pad === 'a' ? 'TRYKK' : 'LØP'); $('runSub').textContent = c.pad === 'a' ? '' : 'TRYKK RASKT';
  }
};
{
  const pad = $('runpad');
  pad.addEventListener('pointerdown', e => {
    e.preventDefault(); try { pad.setPointerCapture(e.pointerId); } catch (_) { }
    pad.classList.add('on'); Snd.init();
    const k = document.body.dataset.pad === 'a' ? 'a' : ((TUI.tog ^= 1) ? 'l' : 'r');
    Input.press(k); setTimeout(() => Input.release(k), 45);
  });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(n => pad.addEventListener(n, () => pad.classList.remove('on')));
  pad.addEventListener('contextmenu', e => e.preventDefault());
  /* trykk direkte på lerretet (menyvalg) */
  cv.addEventListener('pointerdown', e => {
    Snd.init();
    const r = cv.getBoundingClientRect();
    Input.tap = { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
  });
}
const isTouch = () => document.body.classList.contains('touch');
{
  const touchy = (window.matchMedia && matchMedia('(pointer:coarse)').matches) || 'ontouchstart' in window || navigator.maxTouchPoints > 0;
  if (touchy) document.body.classList.add('touch');
  addEventListener('touchstart', () => { if (!isTouch()) { document.body.classList.add('touch'); resize(); } }, { once: true, passive: true });
}
/* layout: på mobil får kontrollene egne felt (sidene i liggende, under spillet i stående) – ingenting dekker banen */
function resize() {
  const iw = innerWidth, ih = innerHeight, b = document.body, touch = isTouch(), land = iw >= ih;
  b.classList.toggle('land', land); b.classList.toggle('port', !land);
  const tc = $('touch'), px = v => Math.round(v) + 'px';
  let cw, ch, cl, ct;
  const mini = (id, x, y) => { const el = $(id); el.style.left = px(x); el.style.top = px(y); };
  if (!touch) {
    const s = Math.min(iw / W, ih / H); cw = W * s; ch = H * s; cl = (iw - cw) / 2; ct = (ih - ch) / 2;
    mini('bMute', iw - 42, 6); mini('bFs', iw - 84, 6); $('bPause').style.display = 'none'; $('hint').style.display = 'none';
  } else if (land) {
    const gut = clamp(iw * .145, 96, 200), s = Math.min((iw - 2 * gut) / W, ih / H);
    cw = W * s; ch = H * s; cl = (iw - cw) / 2; ct = (ih - ch) / 2;
    const gw = cl, sz = Math.min(gw * .8, ih * .27, 124);
    $('zL').style.cssText = `left:0;top:0;width:${px(gw)};height:${px(ih)}`;
    $('zR').style.cssText = `left:${px(iw - gw)};top:0;width:${px(gw)};height:${px(ih)}`;
    tc.style.setProperty('--s', px(sz)); tc.style.setProperty('--pw', px(gw * .86)); tc.style.setProperty('--cw', px(Math.min(gw * .94, ih * .5, 190))); tc.style.setProperty('--ph', px(Math.min(ih * .72, 330)));
    const mx = iw - gw / 2 - 17;
    mini('bMute', mx, 8); mini('bFs', mx, 50); mini('bPause', mx, 92); $('bPause').style.display = 'flex'; $('hint').style.display = 'none';
  } else {
    cw = iw; ch = Math.min(iw * H / W, ih * .5); cw = ch * W / H; cl = (iw - cw) / 2; ct = 0;
    const top = ch + 26, zh = ih - top, sz = Math.min(iw * .27, zh * .3, 132);
    $('zL').style.cssText = `left:0;top:${px(top)};width:${px(iw / 2)};height:${px(zh)}`;
    $('zR').style.cssText = `left:${px(iw / 2)};top:${px(top)};width:${px(iw / 2)};height:${px(zh)}`;
    tc.style.setProperty('--s', px(sz)); tc.style.setProperty('--pw', px(iw * .44)); tc.style.setProperty('--cw', px(Math.min(iw * .44, zh * .55, 200))); tc.style.setProperty('--ph', px(Math.min(zh * .8, 260)));
    mini('bMute', iw - 42, ch + 4); mini('bFs', iw - 84, ch + 4); mini('bPause', iw - 126, ch + 4); $('bPause').style.display = 'flex';
    const h = $('hint'); h.style.display = 'block'; h.style.top = px(ch + 6); h.style.right = px(136); h.style.left = '0';
  }
  cv.style.width = px(cw); cv.style.height = px(ch); cv.style.left = px(cl); cv.style.top = px(ct);
}
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 120));
document.addEventListener('fullscreenchange', () => setTimeout(resize, 80));
if (window.visualViewport) visualViewport.addEventListener('resize', resize);

/* =====================================================================
   DEL 1b: LYD – Web Audio med romklang, kompressor, publikum, bjelle og 8-bit-musikk
   (alt syntetiseres i koden – ingen lydfiler)
   ===================================================================== */
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const Snd = {
  ctx: null, master: null, bus: null, musBus: null, nbuf: null, pbuf: null, muted: false, vol: .85,
  init() {
    if (!this.ctx) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        const c = this.ctx = new AC();
        this.master = c.createGain(); this.master.gain.value = this.muted ? 0 : this.vol;
        const comp = c.createDynamicsCompressor();
        comp.threshold.value = -14; comp.knee.value = 12; comp.ratio.value = 6; comp.attack.value = .003; comp.release.value = .2;
        this.master.connect(comp); comp.connect(c.destination);
        /* effekt-buss: tørr lyd + stadion-romklang */
        this.bus = c.createGain(); this.bus.connect(this.master);
        const rev = c.createConvolver(); rev.buffer = this.impulse(c, 2.4, 2.4);
        const send = c.createGain(); send.gain.value = .26;
        const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 4800;
        this.bus.connect(send); send.connect(lp); lp.connect(rev); rev.connect(this.master);
        /* musikk-buss med lett ekko */
        this.musBus = c.createGain(); this.musBus.gain.value = .55; this.musBus.connect(this.master);
        const dl = c.createDelay(1); dl.delayTime.value = .234;
        const fb = c.createGain(); fb.gain.value = .28; const dg = c.createGain(); dg.gain.value = .2;
        this.musBus.connect(dg); dg.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(this.master);
        /* støybuffere (hvit + rosa), 4 s */
        const n = Math.floor(c.sampleRate * 4);
        this.nbuf = c.createBuffer(1, n, c.sampleRate); this.pbuf = c.createBuffer(1, n, c.sampleRate);
        const d = this.nbuf.getChannelData(0), p = this.pbuf.getChannelData(0);
        let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
        for (let i = 0; i < n; i++) {
          const w = Math.random() * 2 - 1; d[i] = w;
          b0 = .99886 * b0 + w * .0555179; b1 = .99332 * b1 + w * .0750759; b2 = .969 * b2 + w * .153852;
          b3 = .8665 * b3 + w * .3104856; b4 = .55 * b4 + w * .5329522; b5 = -.7616 * b5 - w * .016898;
          p[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * .5362) * .11; b6 = w * .115926;
        }
        Voice.init(); Amb.start();
        if (Music.pending) { const s = Music.pending; Music.pending = null; Music.play(s); }

    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  impulse(c, dur, dec) {
    const n = Math.floor(c.sampleRate * dur), b = c.createBuffer(2, n, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = b.getChannelData(ch); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, dec); }
    return b;
  },
  setMuted(m) {
    this.muted = m; store.set('muted', m);
    if (this.master) this.master.gain.value = m ? 0 : this.vol;
    if (m) { try { speechSynthesis.cancel(); } catch (e) { } }
    document.getElementById('bMute').innerHTML = m ? '&#128263;' : '&#128266;';
  },
  /* én tonestemme: type, volum, glid (to), lavpass (lp/lpTo), pan, sustain (sus) */
  tone(f, d, o = {}) {
    if (!this.ctx || this.muted) return;
    const c = this.ctx, t = c.currentTime + (o.delay || 0);
    const os = c.createOscillator(), gn = c.createGain();
    os.type = o.type || 'square';
    os.frequency.setValueAtTime(f, t);
    if (o.to) os.frequency.exponentialRampToValueAtTime(Math.max(20, o.to), t + d);
    if (o.det) os.detune.value = o.det;
    const v = o.vol == null ? .18 : o.vol, a = o.att == null ? .006 : o.att;
    gn.gain.setValueAtTime(.0001, t); gn.gain.linearRampToValueAtTime(v, t + a);
    if (o.sus == null) gn.gain.exponentialRampToValueAtTime(.0001, t + Math.max(d, a + .01));
    else {
      const rel = o.rel || .05, t1 = t + Math.min(a + .12, d * .5), t2 = Math.max(t1, t + d - rel);
      gn.gain.linearRampToValueAtTime(Math.max(.0002, v * o.sus), t1); gn.gain.setValueAtTime(Math.max(.0002, v * o.sus), t2); gn.gain.linearRampToValueAtTime(.0001, t + d);
    }
    if (o.lp) {
      const fl = c.createBiquadFilter(); fl.type = 'lowpass'; fl.Q.value = o.q || .8; fl.frequency.setValueAtTime(o.lp, t);
      if (o.lpTo) fl.frequency.exponentialRampToValueAtTime(o.lpTo, t + (o.lpT || d));

    } else os.connect(gn);
    let out = gn;
    if (o.pan && c.createStereoPanner) { const pn = c.createStereoPanner(); pn.pan.value = o.pan; gn.connect(pn); out = pn; }
    out.connect(o.dest || this.bus);

  },
  noise(d, o = {}) {

    const c = this.ctx, t = c.currentTime + (o.delay || 0);
    const s = c.createBufferSource(); s.buffer = o.pink ? this.pbuf : this.nbuf; s.loop = true;
    const f = c.createBiquadFilter(); f.type = o.type || 'lowpass';
    f.frequency.setValueAtTime(o.f || 3000, t);
    if (o.to) f.frequency.exponentialRampToValueAtTime(Math.max(30, o.to), t + d);
    f.Q.value = o.q || .7;
    const gn = c.createGain(), v = o.vol == null ? .2 : o.vol, a = o.att || .004;
    gn.gain.setValueAtTime(.0001, t); gn.gain.linearRampToValueAtTime(v, t + a); gn.gain.exponentialRampToValueAtTime(.0001, t + Math.max(d, a + .01));
    s.connect(f); f.connect(gn);
    let out = gn;
    if (o.pan && c.createStereoPanner) { const pn = c.createStereoPanner(); pn.pan.value = o.pan; gn.connect(pn); out = pn; }
    out.connect(o.dest || this.bus);
    s.start(t, Math.random() * 3); s.stop(t + d + .05);
  },
  /* ---------- effekter ---------- */
  step(v) { v = v || .5; const j = rnd(.85, 1.2); this.noise(.045, { f: 2400 * j, type: 'bandpass', q: .9, vol: .05 + .06 * v, att: .002, pan: rnd(-.25, .25) }); this.tone(125 * j, .06, { type: 'sine', to: 70, vol: .05 + .04 * v, att: .002 }); },
  select() { this.tone(880, .07, { type: 'triangle', vol: .11 }); },
  ok() { this.tone(660, .09, { type: 'triangle', vol: .13 }); this.tone(990, .16, { type: 'triangle', vol: .13, delay: .07 }); },
  back() { this.tone(520, .12, { type: 'triangle', vol: .12, to: 330 }); },
  beep(f = 880, d = .12) { this.tone(f, d, { type: 'triangle', vol: .15 }); },
  jump() { this.noise(.2, { f: 500, to: 1800, type: 'bandpass', q: 1.2, vol: .13, att: .05 }); this.tone(240, .16, { type: 'sine', to: 520, vol: .09 }); },
  whoosh() { this.noise(.45, { f: 300, to: 3200, type: 'bandpass', q: .8, vol: .22, att: .15 }); },
  thud() { this.noise(.25, { f: 700, to: 90, vol: .5 }); this.tone(95, .22, { type: 'sine', to: 38, vol: .6, att: .002 }); },
  sand() { this.noise(.32, { f: 2200, to: 260, vol: .34, pink: true }); this.tone(80, .15, { type: 'sine', to: 45, vol: .3 }); },
  hit() { /* hekk i bakken: metallisk skramling */
    for (let i = 0; i < 5; i++) this.noise(.06, { f: 2600 + rnd(0, 2600), type: 'bandpass', q: 5, vol: .2, delay: i * .037, att: .002, pan: rnd(-.3, .3) });
    this.tone(1100, .3, { type: 'triangle', to: 780, vol: .1 }); this.tone(190, .14, { type: 'sine', to: 70, vol: .35 });
  },
  bar() { /* lista rasler */
    this.tone(1320, .6, { type: 'sine', vol: .12 }); this.tone(1980, .4, { type: 'sine', vol: .06 });
    for (let i = 0; i < 4; i++) this.noise(.05, { f: 3500, type: 'bandpass', q: 6, vol: .18, delay: i * .06 });
  },
  gun() { /* startpistol: skarpt smell + kropp + ekko fra stadion */
    this.noise(.07, { f: 1500, type: 'highpass', vol: .95, att: .001 });
    this.noise(.4, { f: 4500, to: 500, vol: .55, att: .001 });
    this.tone(180, .24, { type: 'sine', to: 48, vol: .75, att: .001 });
    this.noise(.06, { f: 1400, type: 'highpass', vol: .26, delay: .2 }); this.noise(.3, { f: 2600, to: 400, vol: .14, delay: .2 });
    this.noise(.06, { f: 1200, type: 'highpass', vol: .11, delay: .44 });
  },
  foul() { /* sur dommersummer */
    this.tone(155, .32, { type: 'sawtooth', vol: .2, lp: 900, att: .01, sus: .9 });

    this.tone(130, .4, { type: 'sawtooth', vol: .2, lp: 800, att: .01, sus: .9, delay: .3 });
  },
  good() { [523, 659, 784, 1047].forEach((f, i) => { this.tone(f, .5, { type: 'sine', vol: .12, delay: i * .07 }); this.tone(f * 2, .3, { type: 'sine', vol: .04, delay: i * .07 }); }); },
  perfect() { [784, 988, 1319].forEach((f, i) => { this.tone(f, .35, { type: 'sine', vol: .12, delay: i * .05 }); this.tone(f * 2, .2, { type: 'triangle', vol: .04, delay: i * .05 }); }); },
  tick(k = 1) { this.tone(k > .7 ? 2300 : 1500, .03, { type: 'triangle', vol: .05 + .05 * k }); },
  click() { /* kameralukker */
    this.noise(.03, { f: 3200, type: 'highpass', vol: .3, att: .001 }); this.tone(2200, .03, { type: 'square', vol: .05 });
    this.noise(.05, { f: 1800, type: 'highpass', vol: .25, delay: .07, att: .001 }); this.tone(1400, .04, { type: 'square', vol: .04, delay: .07 });
  },
  /* bjelle: uharmoniske overtoner med lange etterklang – ringes flere ganger (siste runde) */
  bell(n = 1, gap = .3) { for (let k = 0; k < n; k++) this.bellHit(k * gap + (k ? rnd(-.03, .03) : 0), k ? rnd(.75, 1) : 1); },
  bellHit(delay, vel) {
    if (!this.ctx || this.muted) return;
    const c = this.ctx, t = c.currentTime + delay, f0 = 640;
    [[.5, .5, 2.4], [1, 1, 2.0], [1.19, .6, 1.5], [1.5, .25, 1.1], [2, .7, 1.3], [2.76, .5, 1.0], [4.07, .35, .65], [5.43, .25, .45], [6.8, .14, .3]].forEach(([r, gv, dc]) => {
      const os = c.createOscillator(), gn = c.createGain();
      os.type = 'sine'; os.frequency.value = f0 * r * (1 + rnd(-.002, .002));
      gn.gain.setValueAtTime(.0001, t); gn.gain.linearRampToValueAtTime(.2 * gv * vel, t + .002); gn.gain.exponentialRampToValueAtTime(.0001, t + dc);
      os.connect(gn); gn.connect(this.bus); os.start(t); os.stop(t + dc + .05);
    });
    this.noise(.03, { f: 5000, type: 'highpass', vol: .22 * vel, delay, att: .001 });
  },
  /* publikum: tre formantbånd med flagrende volum */
  cheer(d = 1.6, vol = .22) {
    if (!this.ctx || this.muted) return;
    const c = this.ctx, t = c.currentTime;
    [[650, .8], [1350, 1], [2600, .5]].forEach(([fq, gv]) => {
      const s = c.createBufferSource(); s.buffer = this.pbuf; s.loop = true;
      const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = fq; f.Q.value = .9;
      const gn = c.createGain(), v = vol * gv * 2.4;
      gn.gain.setValueAtTime(.0001, t); gn.gain.linearRampToValueAtTime(v, t + .3);
      for (let u = .35; u < d - .3; u += .1) gn.gain.linearRampToValueAtTime(v * rnd(.55, 1), t + u);
      gn.gain.linearRampToValueAtTime(.0001, t + d);
      s.connect(f); f.connect(gn); gn.connect(this.bus); s.start(t, Math.random() * 3); s.stop(t + d + .05);
    });
    Amb.swell(vol * .2, d);
  },
  applause(d = 3, vol = .2) {
    if (!this.ctx || this.muted) return;
    const c = this.ctx, t = c.currentTime;
    const s = c.createBufferSource(); s.buffer = this.nbuf; s.loop = true;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 2200; f.Q.value = .5;
    const gn = c.createGain();
    gn.gain.setValueAtTime(.0001, t); gn.gain.linearRampToValueAtTime(vol, t + .3);
    for (let u = .3; u < d - .4; u += .028) gn.gain.setValueAtTime(vol * rnd(.15, 1) * (.6 + .4 * Math.sin(u * 2.3)), t + u);
    gn.gain.linearRampToValueAtTime(.0001, t + d);
    s.connect(f); f.connect(gn); gn.connect(this.bus); s.start(t, Math.random() * 3); s.stop(t + d + .05);
  },
  groan() { this.tone(240, .6, { type: 'sawtooth', to: 110, vol: .12, lp: 700, sus: .8, att: .04 }); this.noise(.5, { f: 600, to: 250, type: 'bandpass', q: .8, vol: .1, pink: true }); }
};

/* publikumsmumling (lav bakgrunnsstøy som svulmer opp ved jubel) */
const Amb = {
  g: null, lvl: .03,
  start() {
    if (this.g || !Snd.ctx) return;
    const c = Snd.ctx, s = c.createBufferSource(); s.buffer = Snd.pbuf; s.loop = true;
    const f1 = c.createBiquadFilter(); f1.type = 'bandpass'; f1.frequency.value = 520; f1.Q.value = .5;
    const f2 = c.createBiquadFilter(); f2.type = 'lowpass'; f2.frequency.value = 1800;
    this.g = c.createGain(); this.g.gain.value = 0;
    s.connect(f1); f1.connect(f2); f2.connect(this.g); this.g.connect(Snd.master); s.start();
    const lfo = c.createOscillator(); lfo.frequency.value = .13; const ld = c.createGain(); ld.gain.value = 120; lfo.connect(ld); ld.connect(f1.frequency); lfo.start();
    this.set(this.lvl);
  },
  set(l, tc = .8) { this.lvl = l; if (this.g) this.g.gain.setTargetAtTime(l * 1.8, Snd.ctx.currentTime, tc); },
  swell(add, dur) {
    if (!this.g) return;
    const t = Snd.ctx.currentTime, base = this.lvl * 1.8;
    this.g.gain.cancelScheduledValues(t); this.g.gain.setValueAtTime(this.g.gain.value, t);
    this.g.gain.linearRampToValueAtTime(base + add, t + .4); this.g.gain.linearRampToValueAtTime(base, t + Math.max(dur, 1) + .8);
  }
};

/* ---------- musikk: liten flerkanals sekvenser (lead, arpeggio, bass, trommer, messing) ---------- */

      [64, 79, 2], [66, 79, 2], [68, 88, 4], [72, 86, 2], [74, 84, 2], [76, 83, 2], [78, 84, 2], [80, 83, 4], [84, 86, 4], [88, 91, 4], [92, 86, 4],
      [96, 81, 2], [98, 84, 2], [100, 89, 4], [104, 88, 2], [106, 84, 2], [108, 81, 4], [112, 86, 4], [116, 83, 4], [120, 79, 8]].forEach(([st, n, l]) => add('lead', st, n, l));

  fanfare: {

      [32, 81, 3], [36, 84, 3], [40, 89, 3], [44, 88, 2], [46, 84, 2], [48, 83, 3], [52, 86, 3], [56, 91, 4], [60, 86, 2], [62, 83, 2],

const Music = {
  gain: null, timer: null, cur: null, pending: null,
  play(name) {
    this.stop();
    if (!Snd.ctx) { this.pending = name; return; }
    this.cur = name; this.loop(name);
  },
  loop(name) {
    if (this.cur !== name || !Snd.ctx) return;
    const S = SONGS[name], c = Snd.ctx, sp = 60 / S.bpm / 4, T0 = .06;
    const dst = this.gain = c.createGain(); dst.connect(Snd.musBus);
    S.build((kind, step, a, len = 2, vol = 1) => INST[kind](T0 + step * sp, a, Math.max(.04, len * sp * .92), vol, dst));
    this.timer = setTimeout(() => this.loop(name), (S.bars * 16 * sp + T0) * 1000 - 60);
  },
  stop() {
    this.cur = null; this.pending = null; clearTimeout(this.timer);
    if (this.gain && Snd.ctx) { const g0 = this.gain; try { g0.gain.cancelScheduledValues(0); g0.gain.setValueAtTime(0, Snd.ctx.currentTime); } catch (e) { } this.gain = null; }
  }
};

/* tale: Web Speech (nb-NO) – startkommandoer */
const Voice = {
  v: null,
  init() {
    try {
      const pickV = () => {
        const vs = speechSynthesis.getVoices();
        this.v = vs.find(v => /^nb/i.test(v.lang)) || vs.find(v => /^no/i.test(v.lang)) || vs.find(v => /^nn/i.test(v.lang)) || null;
      };
      pickV(); speechSynthesis.onvoiceschanged = pickV;
    } catch (e) { }
  },
  say(t, rate = .86, pitch = .6) {
    if (Snd.muted) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(t);
      u.lang = 'nb-NO'; if (this.v) u.voice = this.v;
      u.rate = rate; u.pitch = pitch; u.volume = 1;
      speechSynthesis.speak(u);
    } catch (e) { }
  }
};

const shade = (hex, f) => {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp(Math.round(((n >> 16) & 255) * f), 0, 255), gg = clamp(Math.round(((n >> 8) & 255) * f), 0, 255), b = clamp(Math.round((n & 255) * f), 0, 255);

};

const CLASS_REF = {

/* spillets «gjennomsnittlige klubbløper» (motstanderne) gir ca. 750 poeng i klassen */
const GAME_AVG = [8.44, 5.5, 10.3, 1.72, 121.8], TYP = .88;
const Cls = {
  g: 'J', age: 13,
  ref(i) { return CLASS_REF[this.g][EVENTS[i].id][this.age - 11]; },
  hjOff() { return Math.round((1.72 - TYP * this.ref(3)) / .05) * .05; },
  /* spillverdi -> resultat i valgt klasse (monoton, beholder rekkefølgen) */
  real(i, v) {
    if (v == null || isNaN(v)) return v;
    const R = this.ref(i);
    if (i === 3) return +(v - this.hjOff()).toFixed(2);
    if (i === 0 || i === 4) return v * (2 - TYP) * R / GAME_AVG[i];
    return v * TYP * R / GAME_AVG[i];
  },
  /* motsatt vei for lengde/kule: resultat (m) -> spillavstand */
  inv(i, r) { return r / (TYP * this.ref(i) / GAME_AVG[i]); },
  fmt(i, v) { return v == null ? '-' : EVENTS[i].f(this.real(i, v)); },
  pts(i, r) {
    if (r == null || isNaN(r)) return 0;
    const R = this.ref(i), d = (i === 0 || i === 4) ? (R - r) / R : (r - R) / R, s = [2.0, 2.2, 2.2, 2.6, 2.0][i];
    return clamp(Math.round(1000 + 1000 * d * s), 10, 1600);
  },
  refText(i) {
    const R = this.ref(i);
    return (i === 4 ? Math.floor(R / 60) + ':' + String(Math.round(R % 60)).padStart(2, '0') : EVENTS[i].f(R).replace('.', ',')) .toUpperCase() + ' = 1000 TYRVINGPOENG';
  },
  name() { return (this.g === 'J' ? 'JENTER ' : 'GUTTER ') + this.age + ' ÅR'; },
  short() { return this.g + this.age; },
  key() { return this.g + this.age; },

/* ---------- utøver-skjelett ---------- */
const LEN = { th: .46, sh: .46, to: .56, ua: .30, fa: .28 };
const ST = { h: undefined, to: 0, tl: 0, tr: 0, sl: 0, sr: 0, al: 6, ar: -6, el: 14, er: 4, ht: 0 };
function F(o) {
  const f = Object.assign({}, ST, o);
  if (f.h === undefined) {
    const dl = Math.cos(f.tl * D2R) * LEN.th + Math.cos(f.sl * D2R) * LEN.sh;
    const dr = Math.cos(f.tr * D2R) * LEN.th + Math.cos(f.sr * D2R) * LEN.sh;
    f.h = Math.max(dl, dr) + 0.03;
  }
  return f;
}
const OUTL = '#161a2e';
function drawFigure(ctx, x, gy, ppm, f, col, dir = 1, off = 0) {
  const S = a => Math.sin(a * D2R) * dir, Co = a => Math.cos(a * D2R);
  const hx = x, hy = gy - (f.h + off) * ppm;
  const thL = Math.max(1.8, .118 * ppm), thA = Math.max(1.6, .088 * ppm), thT = Math.max(2.6, .27 * ppm);
  const sx = hx + S(f.to) * LEN.to * ppm, sy = hy - Co(f.to) * LEN.to * ppm;
  const sh = col.sh || col.c2, acc = col.c2;
  const ops = [];
  const L = (x0, y0, x1, y1, th, c) => ops.push({ t: 0, x0, y0, x1, y1, th, c });
  const Dc = (cx, cy, r, c) => ops.push({ t: 1, cx, cy, r, c });
  const Rc = (rx, ry, w, h, c) => ops.push({ t: 2, rx, ry, w, h, c });
  const leg = (t, s, skinC) => {
    const kx = hx + S(t) * LEN.th * ppm, ky = hy + Co(t) * LEN.th * ppm;
    const ax = kx + S(s) * LEN.sh * ppm, ay = ky + Co(s) * LEN.sh * ppm;
    L(hx, hy, kx, ky, thL, skinC);
    L(kx, ky, ax, ay, thL, skinC);
    L(hx, hy, hx + (kx - hx) * .55, hy + (ky - hy) * .55, thL + 1, sh);          /* shorts */
    const fa = s + 90, fx = ax + S(fa) * .17 * ppm, fy = ay + Co(fa) * .17 * ppm;
    L(ax, ay, fx, fy, Math.max(2, thL), col.shoe);                                /* sko */
    if (ppm >= 14) L(ax, ay + 1, fx, fy + 1, 1, col.sole || '#e8742c');           /* pigg-såle */
  };
  const arm = (a, e, skinC) => {
    const ex = sx + S(a) * LEN.ua * ppm, ey = sy + Co(a) * LEN.ua * ppm;
    const hx2 = ex + S(e) * LEN.fa * ppm, hy2 = ey + Co(e) * LEN.fa * ppm;
    L(ex, ey, hx2, hy2, thA, skinC);
    L(sx, sy, ex, ey, thA, skinC);
    L(sx, sy, sx + (ex - sx) * .6, sy + (ey - sy) * .6, thA + 1, col.c1);       /* erme */
    if (ppm >= 14) L(sx + (ex - sx) * .5, sy + (ey - sy) * .5, sx + (ex - sx) * .62, sy + (ey - sy) * .62, thA + 1, acc);
  };
  leg(f.tr, f.sr, col.skinD);
  arm(f.ar, f.er, col.skinD);
  /* overkropp: trøye, detaljfelt (nederst), shorts-linning */
  L(hx, hy, sx, sy, thT, col.c1);
  L(hx + (sx - hx) * .14, hy + (sy - hy) * .14, hx + (sx - hx) * .3, hy + (sy - hy) * .3, thT, acc);
  L(hx, hy, hx + (sx - hx) * .14, hy + (sy - hy) * .14, thT, sh);
  if (col.bib !== false && ppm >= 14) { const bx = hx + (sx - hx) * .62, by = hy + (sy - hy) * .62; Rc(bx - 1.8, by - 1.6, 3.6, 3.4, '#f4f4f4'); Rc(bx - .6, by - .4, 1.2, 1, '#2a2d3a'); }
  leg(f.tl, f.sl, col.skin);
  arm(f.al, f.el, col.skin);
  /* hode */
  const hr = Math.max(2, .115 * ppm), hd = (.07 + .115) * ppm;
  const cx = sx + S(f.to + f.ht) * hd, cy = sy - Co(f.to + f.ht) * hd;
  if (col.girl) {                                                                  /* jente: hestehale (bak hodet) */
    const bk = -dir, sw = Math.sin(f.to * D2R * 2) * hr * .12;
    Dc(cx + bk * hr * .9, cy + hr * .02, hr * .6, col.hair);
    Dc(cx + bk * hr * 1.62, cy + hr * .7 + sw, hr * .55, col.hair);
    Dc(cx + bk * hr * 1.92, cy + hr * 1.45 + sw, hr * .46, col.hair);
  }
  Dc(cx, cy, hr, col.hair);
  if (col.girl) Dc(cx - dir * hr * .78, cy - hr * .02, Math.max(.7, hr * .2), col.c2);   /* hårstrikk i klubbfarge */
  Dc(cx + dir * hr * .28, cy + hr * .22, hr * .82, col.skin);
  if (ppm >= 20) Rc(cx + dir * hr * .5, cy - hr * .08, Math.max(.9, ppm * .05), Math.max(.9, ppm * .05), '#111');
  /* tegn: 1) mørk silhuett-kontur  2) farger  3) lys/skygge for rund, tredimensjonal følelse */
  const ow = Math.max(.9, ppm * .05);
  for (const o of ops) {
    if (o.t === 0) pline(ctx, o.x0, o.y0, o.x1, o.y1, o.th + ow * 1.6, OUTL);
    else if (o.t === 1) disc(ctx, o.cx, o.cy, o.r + ow * .8, OUTL);
    else { ctx.fillStyle = OUTL; ctx.fillRect(o.rx - ow * .8, o.ry - ow * .8, o.w + ow * 1.6, o.h + ow * 1.6); }
  }
  for (const o of ops) {
    if (o.t === 0) {
      pline(ctx, o.x0, o.y0, o.x1, o.y1, o.th, o.c);
      if (o.th >= 2.2) {
        const dx = o.x1 - o.x0, dy = o.y1 - o.y0, l = Math.hypot(dx, dy) || 1; let nx = -dy / l, ny = dx / l; if (ny > 0) { nx = -nx; ny = -ny; }
        const so = o.th * .24;
        pline(ctx, o.x0 + nx * so, o.y0 + ny * so, o.x1 + nx * so, o.y1 + ny * so, o.th * .36, 'rgba(255,255,255,.26)');
        pline(ctx, o.x0 - nx * so, o.y0 - ny * so, o.x1 - nx * so, o.y1 - ny * so, o.th * .3, 'rgba(0,0,20,.2)');
      }
    } else if (o.t === 1) {
      if (o.c === col.skin || o.c === col.skinD) ball(ctx, o.cx, o.cy, o.r, o.c, .22); else ball(ctx, o.cx, o.cy, o.r, o.c, .15);
    } else { ctx.fillStyle = o.c; ctx.fillRect(o.rx, o.ry, o.w, o.h); }
  }
}

const sinp = s => Math.sin(Math.PI * clamp(s, 0, 1));

  const sw = 42 * (0.5 + 0.5 * amp);
  const al = -sw * Math.sin(ph), ar = sw * Math.sin(ph);
  return F({ to: lean, tl, sl, tr, sr, al, ar, el: al + 60, er: ar + 60 });
}

function poseHurdle(s) {
  const a = sinp(s);

  const ltt = s < .5 ? lt : lerp(90, 25, clamp((s - .5) * 2, 0, 1));
  const tt = s < .45 ? lerp(-30, -40, s / .45) : lerp(-40, 70, clamp((s - .45) / .4, 0, 1));
  const ts = s < .85 ? tt - 100 : tt - 35;
  return F({ to: 14 + 34 * a, tl: ltt, sl: ls, tr: s < .85 ? tt : lerp(70, 10, (s - .85) / .15), sr: ts, al: -50 * a - 10, el: -30 * a, ar: 115 * a, er: 130 * a, ht: 5 });
}

/* =====================================================================
   DEL 2b: BAKGRUNN (semi-3D, vektor) – Dalgård idrettspark med Byåsen, Tyholttårnet og fjorden
   Lagdelt parallakse (fjell → åser → skog → stadion → publikum → skilt → gress) + atmosfærisk dybde.
   Alt tegnes i logiske koordinater på høyoppløselige lerret (S x), så det er skarpt og glatt.
   ===================================================================== */
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const BG = {};
const BGW = 640, GROUND_Y = 118, BASE_Y = 102;
const lgrad = (x, y0, y1, stops) => { const gr = x.createLinearGradient(0, y0, 0, y1); stops.forEach(s => gr.addColorStop(s[0], s[1])); return gr; };
const rgrad = (x, cx, cy, r0, r1, stops) => { const gr = x.createRadialGradient(cx, cy, r0, cx, cy, r1); stops.forEach(s => gr.addColorStop(s[0], s[1])); return gr; };
const rect = (x, c, xx, yy, w, h) => { x.fillStyle = c; x.fillRect(xx, yy, w, h); };
const poly = (x, c, pts) => { x.fillStyle = c; x.beginPath(); x.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) x.lineTo(pts[i][0], pts[i][1]); x.closePath(); x.fill(); };
/* kule med skyggelegging (3D-følelse) */
function ball(x, cx, cy, r, c, hi = .3) {
  x.fillStyle = rgrad(x, cx - r * .35, cy - r * .4, r * .1, r * 1.05, [[0, shade(c, 1 + hi)], [.6, c], [1, shade(c, .62)]]);
  x.beginPath(); x.arc(cx, cy, r, 0, 6.2832); x.fill();
}
function softCloud(w, h, seed) {
  const c = mkHi(w, h), x = c.getContext('2d'), R = mulberry(seed), n = 8;
  for (let i = 0; i < n; i++) {
    const px = w * .15 + R() * w * .7, py = h * .55 + (R() - .5) * h * .25, r = h * (.22 + R() * .26);
    x.fillStyle = rgrad(x, px, py - r * .3, r * .1, r, [[0, 'rgba(255,255,255,.96)'], [.6, 'rgba(250,252,255,.85)'], [1, 'rgba(210,225,242,.0)']]);
    x.beginPath(); x.arc(px, py, r, 0, 6.2832); x.fill();
  }
  x.globalCompositeOperation = 'source-atop'; x.fillStyle = lgrad(x, 0, h, [[0, 'rgba(255,255,255,0)'], [.6, 'rgba(190,210,235,.0)'], [1, 'rgba(150,175,210,.55)']]); x.fillRect(0, 0, w, h);

}
function spruce(x, tx, by, h, dark, lit) {
  const w = h * .42;
  x.fillStyle = '#3a2a1a'; x.fillRect(tx - .6, by - h * .12, 1.2, h * .12);
  for (let k = 0; k < 4; k++) {
    const y1 = by - h * .1 - k * h * .24, ww = w * (1 - k * .2), th = h * .34;

}

function wrapDraw(img, camPx, y, par) {

   DEL 3: SCENE-MASKIN, SPILLTILSTAND OG MENYER

const Scenes = {
  cur: null, fade: 0,
  go(s) { this.cur = s; s.t = 0; this.fade = 1; Input.clear(); Amb.set(s.amb != null ? s.amb : .035); if (s.enter) s.enter(); }
};
const Game = {
  mode: 'dec', club: 0, totals: [0, 0, 0, 0, 0, 0], field: [0, 1, 2, 3, 4], evIdx: 0, paused: false, trainEv: 0, bestHist: {},
  cpu() { return this.field.filter(i => i !== this.club); },
  nulls(v = null) { return CLUBS.map(() => v); },
  /* deltakerfelt: din klubb + 4 tilfeldige av de andre fem */
  pickField() {
    const others = CLUBS.map((c, i) => i).filter(i => i !== this.club);
    for (let i = others.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [others[i], others[j]] = [others[j], others[i]]; }
    this.field = [this.club].concat(others.slice(0, 4));
  },
  pause(p) { if (Scenes.cur && Scenes.cur.pausable) { this.paused = p; if (p) Input.clear(); } },
  toTitle() { this.paused = false; Music.stop(); Scenes.go(new TitleScene()); },
  startDecathlon() {
    this.mode = 'dec'; this.totals = this.nulls(0); this.evIdx = 0; this.history = []; this.pickField(); this.newSkills();
    Scenes.go(new IntroScene(0, false));
  },
  newSkills() { this.skill = CLUBS.map(() => clamp(gauss() * .7, -1.3, 1.3)); },
  startTraining() { this.mode = 'train'; this.pickField(); this.newSkills(); Scenes.go(new TrainSelectScene()); },
  makeEvent(i, training) {
    return [new HurdlesScene(training), new LongJumpScene(training), new ShotScene(training), new HighJumpScene(training), new Run800Scene(training)][i];
  },
  /* vals[ci] = tall eller null, txt[ci] = tekst ved ugyldig/DQ/NM */
  eventDone(i, vals, txt, training) {
    const ev = EVENTS[i];
    vals = vals.map(v => Cls.real(i, v));                 /* spillverdi -> resultat i valgt klasse */
    const pts = vals.map(v => Cls.pts(i, v));
    const order = this.field.slice().sort((a, b) => cmpVal(ev, vals[a], vals[b]) || (a === Game.club ? -1 : 0));
    if (training) { Scenes.go(new TrainResultScene(i, vals, txt, pts, order)); return; }
    this.field.forEach(ci => this.totals[ci] += pts[ci]);
    this.history.push({ vals, pts, order });
    Scenes.go(new ResultScene(i, vals, txt, pts, order));
  }
};
function cmpVal(ev, a, b) {
  if (a == null && b == null) return 0;
  if (a == null) return 1;
  if (b == null) return -1;
  return ev.kind === 'time' ? a - b : b - a;
}

const laneFeet = i => LANE_EDGE[i + 1] - 3.4 * laneK(i);
const BC = { navy: '#0c1535', navy2: '#18265a', red: '#e0242c', dred: '#8e1620', cyan: '#37d4ff', gold: '#ffd23f' };

/* ---------- hovedløkke (fast 60 Hz) ---------- */
let lastTs = 0, acc = 0, gtime = 0;
const STEP = 1 / 60;
function frame(ts) {
  g.setTransform(S, 0, 0, S, 0, 0);
  requestAnimationFrame(frame);
  const dtr = Math.min(0.1, (ts - lastTs) / 1000 || STEP); lastTs = ts;
  acc += dtr;
  let steps = 0;
  while (acc >= STEP && steps < 5) {
    acc -= STEP; steps++;
    const sc = Scenes.cur;
    if (!sc) break;
    if (Input.hit.m) Snd.setMuted(!Snd.muted);
    if (Game.paused) {
      if (Input.hit.a || Input.hit.p) { Game.paused = false; Snd.ok(); }
      else if (Input.hit.b) { Game.paused = false; Snd.back(); Game.toTitle(); }
    } else {
      if (Input.hit.p && sc.pausable) Game.pause(true);
      else { sc.t += STEP; sc.update(STEP); }
    }
    if (Scenes.fade > 0) Scenes.fade = Math.max(0, Scenes.fade - STEP * 3.5);
    Input.end();
  }
  if (steps === 5) acc = 0;
  if (Scenes.cur) {
    TUI.sync(Scenes.cur);
    Scenes.cur.draw();
    drawVignette();
    if (Game.paused) drawPause();
    if (Scenes.fade > 0) { g.fillStyle = `rgba(0,0,0,${Scenes.fade})`; g.fillRect(0, 0, W, H); }
  }
}

/* Felles startsekvens: INNTA PLASSENE -> (KLAR, bare på hekk) -> tilfeldig pause 0.8–2.2 s -> SKUDD. Tyvstart-regler. */
class StartSeq {
  constructor(ready = true) { this.warn = 0; this.state = 'pre'; this.t = 0; this.gunTs = 0; this.delay = 1; this.ready = ready; }
  begin() { this.state = 'pre'; this.t = 0; }
  update() {
    this.t += STEP;
    const pressed = Input.hit.l || Input.hit.r || Input.hit.a;
    switch (this.state) {
      case 'pre':
        if (this.t > .9) { this.state = 'mark'; this.t = 0; Voice.say('Innta plassene', .8, .55); }
        break;
      case 'mark':
        if (pressed && this.t > .12) return this.fs();
        if (this.t > (this.ready ? 3.0 : 3.6)) {
          if (this.ready) { this.state = 'set'; this.t = 0; this.delay = rnd(.9, 2.2); Voice.say('Klar', .9, .6); }
          else { this.state = 'set'; this.t = 0; this.delay = rnd(1.0, 2.0); this.silent = true; }
        }
        break;
      case 'set':
        if (pressed && this.t > .05) return this.fs();
        if (this.t >= this.delay) { this.state = 'go'; this.t = 0; this.gunTs = Clk.now(); Snd.gun(); }
        break;
      case 'warn':
        if (this.t > 2.4) { this.state = 'pre'; this.t = 0; }
        break;
    }
  }
  fs() {
    this.warn++; this.t = 0; Snd.foul(); this.silent = false;
    if (this.warn >= 2) { this.state = 'dq'; Voice.say('Diskvalifisert'); } else { this.state = 'warn'; Voice.say('Tyvstart'); }
  }
  /* tekst midt på skjermen */
  drawText(cy = 70) {
    const s = this.state;
    if (s === 'warn' || s === 'dq') { g.fillStyle = 'rgba(8,12,28,.72)'; g.fillRect(40, cy - 8, 320, 56); }
    if (s === 'mark') txt('INNTA PLASSENE', 200, cy, C.white, 2, 'c', C.dred);
    else if (s === 'set') { if (this.ready) txt('KLAR', 200, cy, C.yellow, 3, 'c', C.dred); else txt('INNTA PLASSENE', 200, cy, C.white, 2, 'c', C.dred); }
    else if (s === 'go' && this.t < .6) { txt('SKUDD!', 200, cy, C.red, 4, 'c', C.white); }
    else if (s === 'warn') { txt('TYVSTART!', 200, cy, C.red, 3, 'c', C.white); txt('ADVARSEL - NESTE GANG = DISKVALIFIKASJON', 200, cy + 28, C.white, 1, 'c'); }
    else if (s === 'dq') { txt('TYVSTART!', 200, cy, C.red, 3, 'c', C.white); txt('DISKVALIFISERT', 200, cy + 28, C.yellow, 2, 'c'); }
  }
}

function hurdleLoss(tau, ez) {
  if (ez) { if (tau >= .14 && tau <= .45) return 0; if (tau > .45) return .03 + (tau - .45) * 1.0; return .03 + (.14 - tau) * 1.0; }
  if (tau >= .175 && tau <= .285) return 0;
  if (tau > .285) return .03 + (tau - .285) * 1.3;
  return .03 + (.175 - tau) * 1.6;
}
function drawHurdleAt(px, gy, fallT, k = 1) {
  const hh = 13 * k;
  groundShadow(px - 1 * k, gy + .8, 7.5 * k, 1.5 * k, .28);
  if (fallT != null) {
    const a = clamp(fallT / .25, 0, 1) * 82 * D2R;
    const tx = px + Math.sin(a) * hh, ty = gy - Math.cos(a) * hh;
    pline(g, px, gy, tx, ty, 1.7 * k, '#f2f2f2');
    pline(g, tx - 2.4 * k, ty - .6 * k, tx + 3.2 * k, ty + .9 * k, 2.6 * k, BC.red);
    return;
  }
  const dx = -3.4 * k, dy = -1.4 * k;          /* fjern stolpe (dybde) */
  pline(g, px + dx - 2 * k, gy + dy, px + dx + 2 * k, gy + dy, 1.1 * k, '#7d838f');

/* ======================= KULESTØT ======================= */
const SP = { RING: 2.135, PPM: 26 };
function solveShot(x0, hr, th, xl) {
  const R = v => { const vx = v * Math.cos(th), vy = v * Math.sin(th); return vx / 9.81 * (vy + Math.sqrt(vy * vy + 2 * 9.81 * hr)); };
  let lo = 2, hi = 40; const target = xl - x0;
  for (let i = 0; i < 40; i++) { const m = (lo + hi) / 2; if (R(m) < target) lo = m; else hi = m; }
  return (lo + hi) / 2;
}
class ShotScene extends FieldBase {
  constructor(tr) { super(2, tr); this.amb = .06; }
  ctl() { const p = this.p; return (this.state === 'end' || this.state === 'result') ? { pad: 'none', a: 'NESTE', b: '' } : { pad: 'a', a: p && p.mode === 'ready' ? 'START' : 'KRAFT', b: 'STØT', pl: p && p.mode === 'ready' ? 'START' : 'KRAFT!' }; }
  enter() { Music.stop(); this.initField(); this.resetAttempt(); }
  genCpu(ci) { const sk = (Game.skill && Game.skill[ci]) || 0, mean = 10.3 + .7 * sk; return [0, 1, 2].map(() => Math.random() < .1 ? null : +clamp(mean + gauss() * .6, 8, 15.4).toFixed(2)); }
  resetAttempt() {
    this.p = { x: .35, mode: 'ready', gt: 0, P: 0, ang: 40, t: 0, ph: 0, ball: null, particles: [], msg: '' };
    this.state = 'run'; this.cam = -3.2; this.resT = 0; this.result = null; this.landX = null; this.tx = null;
  }
  foul() {
    const p = this.p; p.mode = 'foul'; this.state = 'result'; this.resT = 0; this.resText = 'TRÅKKET OVER!'; this.result = null;
    Snd.foul(); Voice.say('Ugyldig'); this.mine.push(null);
  }
  update(dt) {
    if (this.state === 'end') return this.endUpdate(dt);
    const p = this.p;
    p.particles.forEach(q => { q.x += q.vx * dt; q.y += q.vy * dt; q.vy -= 9 * dt; q.t -= dt; }); p.particles = p.particles.filter(q => q.t > 0);
    if (p.mode === 'ready') { if (Input.hit.a) { p.mode = 'glide'; p.gt = 0; p.P = EZ() ? 45 : 12; Snd.beep(700, .06); } }
    else if (p.mode === 'glide') {
      p.gt += dt;
      const ez = EZ();
      if (Input.hit.a) { p.P = Math.min(100, p.P + (ez ? 15 : 9)); Snd.tick(); }
      p.P = Math.max(0, p.P - (ez ? 6 : 18) * dt);
      p.ang = pingpong(p.gt, ez ? 25 : 15, ez ? 55 : 65, ez ? 30 : 60);
      p.x += (ez ? .42 + .008 * p.P : .55 + .012 * p.P) * dt;
      p.ph = p.gt * 6;
      if (Input.hit.b) { this.release(); }
      else if (p.x >= SP.RING) { p.x = SP.RING; if (ez) this.release(); else this.foul(); }
    } else if (p.mode === 'throw') {
      p.t += dt;
      if (!p.ball && p.t >= .26) {
        const b = this.tx;
        p.ball = { x: b.x0, y: b.hr, vx: b.v * Math.cos(b.th), vy: b.v * Math.sin(b.th), trail: [] };
        Snd.whoosh();
      }
      if (p.ball && !p.ball.done) {
        const bl = p.ball; bl.vy -= 9.81 * dt; bl.x += bl.vx * dt; bl.y += bl.vy * dt;
        if (bl.trail.length === 0 || (this.t * 60 | 0) % 2 === 0) bl.trail.push([bl.x, bl.y]);
        if (bl.trail.length > 40) bl.trail.shift();
        this.cam += (bl.x - 5 - this.cam) * Math.min(1, dt * 4);
        if (bl.y <= 0 && bl.vy < 0) {
          bl.done = true; bl.y = 0; this.landX = bl.x; const D = this.tx.D;
          this.state = 'result'; this.resT = 0; this.result = D; this.mine.push(D); this.marks.push(bl.x);
          Snd.thud(); Snd.cheer(D > 12 ? 1.8 : .9, D > 12 ? .2 : .1);
          for (let i = 0; i < 16; i++) p.particles.push({ x: bl.x, y: .05, vx: rnd(-2, 2), vy: rnd(1, 3.2), t: rnd(.3, .6) });
          this.resText = fmt2(Cls.real(2, D)) + ' M';
          this.resSub = this.tx.Pf > .8 ? 'GOD KRAFT!' : 'MER KRAFT: TRYKK A RASKERE';
        }
      }
    }
    if (this.state === 'result') {
      this.resT += dt;
      if (this.resT > 2.8 || (this.resT > 1.2 && Input.hit.a)) { if (this.mine.length < 3) this.resetAttempt(); else this.finalize(); }
    }
  }
  release() {

    const D = 4 + 12.5 * Pf * angF * posF;

  }
  draw() {

      g.strokeStyle = 'rgba(255,255,255,.6)'; g.lineWidth = .7; g.beginPath(); g.moveTo(x, FB0); g.quadraticCurveTo(x + 5, my, x, FB1); g.stroke();
      txt(String(m), x + 1, FB1 + 5, '#dfe7ff', 1, 'c');
    }
    /* tidligere nedslag */
    this.marks.forEach(m => { const mx = sx(m); g.fillStyle = 'rgba(70,45,20,.55)'; g.beginPath(); g.ellipse(mx, my + 1.5, 3, 1.1, 0, 0, 6.2832); g.fill(); g.fillStyle = 'rgba(255,255,255,.18)'; g.beginPath(); g.ellipse(mx - .3, my + 2.3, 2.6, .5, 0, 0, 6.2832); g.fill(); });
    /* ringen i perspektiv */
    const rx0 = sx(0), rx1 = sx(SP.RING), rcx = (rx0 + rx1) / 2, rrx = (rx1 - rx0) / 2, rry = 11, rcy = my;
    g.fillStyle = '#5d6272'; g.beginPath(); g.ellipse(rcx, rcy + 2.4, rrx + .8, rry + .6, 0, 0, 6.2832); g.fill();
    g.fillStyle = rgrad(g, rcx - rrx * .3, rcy - 3, 2, rrx * 1.1, [[0, '#e0e3ea'], [1, '#9298a8']]);
    g.beginPath(); g.ellipse(rcx, rcy, rrx, rry, 0, 0, 6.2832); g.fill();
    g.strokeStyle = '#f2f4f8'; g.lineWidth = 1.5; g.beginPath(); g.ellipse(rcx, rcy, rrx, rry, 0, 0, 6.2832); g.stroke();
    g.strokeStyle = 'rgba(0,0,0,.18)'; g.lineWidth = .6; g.beginPath(); g.ellipse(rcx, rcy, rrx - 1.6, rry - 1.3, 0, 0, 6.2832); g.stroke();
    /* stoppbrett (foran-høyre i ringen) */
    const arcAt = (dy, th, col) => { g.strokeStyle = col; g.lineWidth = th; g.lineCap = 'butt'; g.beginPath(); g.ellipse(rcx, rcy + dy, rrx, rry, 0, -1.15, 1.15); g.stroke(); };
    arcAt(2.8, 4.6, '#6a6f80'); arcAt(.2, 4.6, '#f4f5f8'); arcAt(-1.1, 1.2, BC.red);
    /* utøver */

    let f;
    if (p.mode === 'ready') f = poseShotGlide(0);
    else if (p.mode === 'glide') f = poseShotGlide(clamp(p.x / SP.RING, 0, 1));

/* ======================= HØYDEHOPP =======================
   Nytt, mobilvennlig: tilløpet går av seg selv. Du trykker A to ganger:
   1) start tilløpet  2) SATS når løperen er i det grønne feltet foran lista (lyd-tikk hjelper).
   Svaien (flop) skjer automatisk. B = hopp over denne høyden (pass). */
const HJ = { BAR: 13, PPM: 40, FY: 190, TAIR: .8, VRUN: 5.0, ACC: 5.0, START: 9.5, MAT: .75, ZW: .25, ZY: .55, DW: .8 };
const hjIdeal = v => Math.max(1.5, .55 * v) * HJ.TAIR / 2;   /* ideell avstand til lista ved sats */
class HighJumpScene extends FieldBase {
  constructor(tr) { super(3, tr); this.amb = .06; }
  ctl() {
    const st = this.state, p = this.p;
    if (st === 'select') return { pad: 'nav', a: 'OK', b: '' };
    if (st === 'end') return { pad: 'none', a: 'FORTSETT', b: '' };
    if (st === 'result') return { pad: 'none', a: 'NESTE', b: '' };
    if (!p) return { pad: 'a', a: 'LØP', b: '' };
    if (p.mode === 'ready') return { pad: 'a', a: 'START TILLØP', b: this.barH < 2.0 ? 'PASS' : '', pl: 'START' };
    if (p.mode === 'run') return { pad: 'a', a: 'SATS!', b: '', pl: 'SATS!' };
    return { pad: 'none', a: '', b: '' };
  }
  enter() {
    Music.stop();
    Object.assign(HJ, EZ() ? { ZW: .45, ZY: .6, DW: 1.4 } : { ZW: .25, ZY: .55, DW: .8 });
    this.cpuMax = {};
    Game.cpu().forEach(ci => { const sk = (Game.skill && Game.skill[ci]) || 0; this.cpuMax[ci] = Math.max(1.4, Math.floor((1.72 + .07 * sk + gauss() * .06) / .05 + .0001) * .05); });
    this.barH = 1.55; this.misses = 0; this.cleared = null; this.passed = 0;
    this.state = 'select'; this.endT = 0; this.resT = 0; this.lastFail = false;
    this.resetAttempt(true);
  }
  resetAttempt(first) {
    this.p = { x: HJ.BAR - HJ.START, v: 0, ph: 0, mode: 'ready', started: false, air: null, particles: [], barFall: null, flash: '', flashT: 0, tick: 0, zoneIn: 0 };

  boardRows() {

  update(dt) {

      if (Input.hit.l || Input.hit.d) { this.barH = Math.max(1.4, +(this.barH - .05).toFixed(2)); Snd.select(); }
      if (Input.hit.r || Input.hit.u) { this.barH = Math.min(2.0, +(this.barH + .05).toFixed(2)); Snd.select(); }

    }
    const press = Input.hit.a || Input.hit.l || Input.hit.r;
    if (p.mode === 'ready') {
      if (Input.hit.b && this.barH < 2.0) { this.passed++; this.barH = +(this.barH + .05).toFixed(2); this.msgT = 1; this.msgTxt = 'PASSERER'; Snd.select(); this.cam = p.x - 3; return; }

      const d = HJ.BAR - p.x, id = hjIdeal(p.v), e = d - id;

  takeoff() {

  hipAt(a, s) { const h0 = .95, A = a.A != null ? a.A : (.95 + .15 + a.qs * .95 + a.form); return h0 + (A - h0) * 4 * s * (1 - s); }
  air(dt) {
    const p = this.p, a = p.air;

    if (!a.crossed && p.x >= HJ.BAR) {
      a.crossed = true;

    }

    if (s >= 1 && !a.done) {

      const ok = a.crossed && !a.knock && a.sc <= 1;
      if (ok) { this.success(a); } else this.fail(a.sc > 1 ? 'FOR TIDLIG SATS!' : 'RIV!');
      Snd.thud();

    }
  }
  success(a) {
    this.state = 'result'; this.resT = 0; this.resText = 'GODKJENT ' + fmt2(Cls.real(3, this.barH)) + ' M'; this.lastFail = false;
    this.resSub = a.qs > .88 ? 'PERFEKT TIMING!' : (a.qs > .6 ? 'GOD TIMING' : 'KNAPT - TRYKK LITT NÆRMERE MIDTEN');

  }
  fail(txtMsg) {
    this.state = 'result'; this.resT = 0; this.resText = txtMsg; this.lastFail = true; this.misses++;
    const a = this.p.air;
    this.resSub = !a ? 'TRYKK SATS FØR DU KOMMER FORBI' : (a.sc > 1 ? 'TRYKK SENERE - NÆRMERE LISTA' : (a.e < -.1 ? 'DU TRYKKET FOR SENT' : (a.e > .1 ? 'DU TRYKKET FOR TIDLIG' : 'DET ER RIV: ' + this.misses + '/3')));

  }
  nextAttempt() {
    if (this.lastFail) {
      if (this.misses >= 3) { this.finish(); return; }
    } else { this.barH = +(this.barH + .05).toFixed(2); }
    if (this.barH > 2.05) { this.finish(); return; }
    this.resetAttempt();
  }
  finish() {
    this.state = 'end'; this.endT = 0;
    const vals = Game.nulls();
    Game.cpu().forEach(ci => vals[ci] = this.cpuMax[ci]);
    vals[Game.club] = this.cleared;
    this.vals = vals;
    this.place = 1 + vals.filter((v, ci) => ci !== Game.club && v != null && (this.cleared == null || v > this.cleared)).length;
    if (this.cleared == null) this.place = 5;
    if (this.place <= 2) { Snd.cheer(2.2, .2); Snd.good(); } else Snd.cheer(1, .1);
  }
  draw() {

function makePrize() {
  const gens = [
    () => 'Et gavekort på reise til ' + pick(PRIZE_TRIP) + pick(PRIZE_TRIPX),
    () => 'Ei bøtte ' + pick(PRIZE_BUCKET),

  ];

  do { r = Math.random() < .6 ? pick(PRIZES) : pick(gens)(); } while ((r === lastPrize || r.length > 100) && ++n < 20);
  lastPrize = r; return r;
}
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function wrapText(s, n) {
  const out = []; let line = '';
  s.split(' ').forEach(w => { if ((line + ' ' + w).trim().length > n) { out.push(line.trim()); line = w; } else line += ' ' + w; });
  if (line.trim()) out.push(line.trim());
  return out;
}
class PodiumScene {

  }
  update(dt) {

    if (Math.random() < .55) this.conf.push({ x: rnd(0, W), y: -4, vx: rnd(-10, 10), vy: rnd(30, 70), c: pick([C.red, C.yellow, C.white, C.blue, C.green, C.pink, C.orange]), t: 0 });
    this.conf.forEach(c => { c.t += dt; c.x += (c.vx + Math.sin(c.t * 6) * 14) * dt; c.y += c.vy * dt; }); this.conf = this.conf.filter(c => c.y < H);
    this.sparks.forEach(s => s.t -= dt); this.sparks = this.sparks.filter(s => s.t > 0);

  }
  draw() {
    const T = this.t, PY = 196;

    fieldBand(0, 150, 206, 'track');
    g.fillStyle = 'rgba(30,40,90,.3)'; g.fillRect(0, 150, W, 57);
    /* lyspytt under seierspallen */

    g.fillStyle = rgrad(g, 0, 0, 0, 140, [[0, 'rgba(255,238,180,.5)'], [1, 'rgba(255,238,180,0)']]); g.beginPath(); g.arc(0, 0, 140, 0, 6.2832); g.fill(); g.restore();

    /* seierspall */
    const slots = [[144, 2, 28], [200, 1, 38], [262, 3, 20]];
    const medals = { 1: '#ffd23f', 2: '#d0d6e2', 3: '#c9803a' };

      /* høyre sideflate */
      g.fillStyle = hot ? '#5e0e16' : '#0c1236'; g.beginPath(); g.moveTo(x1, top); g.lineTo(x1 + dd, top - dd * .6); g.lineTo(x1 + dd, PY - dd * .6); g.lineTo(x1, PY); g.closePath(); g.fill();
      /* forside */
      g.fillStyle = lgrad(g, top, PY, hot ? [[0, '#ee2b33'], [1, '#98151e']] : [[0, '#2c4096'], [1, '#141f55']]); g.fillRect(x0, top, 54, h);
      g.fillStyle = 'rgba(255,255,255,.12)'; g.fillRect(x0, top, 8, h);
      g.fillStyle = 'rgba(255,255,255,.9)'; g.fillRect(x0, top, 54, 1.6);
      /* toppflate */
      g.fillStyle = lgrad(g, top - dd * .6, top, [[0, '#f2f4fa'], [1, '#c3c9da']]); g.beginPath(); g.moveTo(x0 + dd, top - dd * .6); g.lineTo(x1 + dd, top - dd * .6); g.lineTo(x1, top); g.lineTo(x0, top); g.closePath(); g.fill();
      txt(String(rank), cx, top + (h < 30 ? 5 : 9), medals[rank], h < 30 ? 2 : 3, 'c', 'rgba(0,0,0,.55)');
      const ci = this.order[rank - 1], me = ci === Game.club, cl = CLUBS[ci];

      if (rank === 2) { f.ar = 120 + Math.sin(T * 6) * 18; f.er = 130 + Math.sin(T * 6) * 18; }
      if (rank === 3) { f.al = 140 + Math.sin(T * 7) * 16; f.el = 150 + Math.sin(T * 7) * 16; }
      const jump = hot ? Math.abs(Math.sin(T * 5)) * .06 : 0, gyP = top - dd * .28;
      groundShadow(cx + 1, gyP + .4, 11, 2.2, .4 * (1 - jump * 2));

    g.fillStyle = '#15171f'; rrect(g, camX, camY, 9, 6, 1); g.fill(); g.fillStyle = '#4a4f66'; rrect(g, camX + 1, camY - 1.4, 4, 1.8, .6); g.fill(); ball(g, camX + 9, camY + 3, 2.2, '#8ea2ff', .6);
    /* banner med arrangementsnavn */
    g.fillStyle = '#d9d9d9'; g.fillRect(14, PY - 6, 2, 8); g.fillRect(52, PY - 6, 2, 8);
    rrect(g, 5, PY - 23, 58, 18, 2.5); g.fillStyle = '#fff'; g.fill(); rrect(g, 6.2, PY - 21.8, 55.6, 15.6, 1.8); g.fillStyle = lgrad(g, PY - 22, PY - 6, [[0, '#1c2a63'], [1, '#0c1535']]); g.fill();
    g.fillStyle = BC.red; g.fillRect(7, PY - 21, 54, 2);
    txt('DALGÅRD', 34, PY - 15, C.white, 1, 'c', null);
    if (shoot) {

      g.fillStyle = '#fff';
      for (let a = 0; a < 8; a++) { const ang = a * Math.PI / 4, l = a % 2 ? 7 : 11; pline(g, fx, fy, fx + Math.cos(ang) * l, fy + Math.sin(ang) * l, 1, '#fff'); }
      disc(g, fx, fy, 3, '#fff');
      g.fillStyle = 'rgba(255,255,255,.28)'; g.fillRect(0, 0, W, H);
    }
    /* konfetti */
    this.conf.forEach(c => { g.fillStyle = c.c; g.save(); g.translate(c.x, c.y); g.rotate(c.t * 5); g.fillRect(-1.2, -.8, 2.4, 1.6); g.restore(); });
